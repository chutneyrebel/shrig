name: Sprig WT (Schwung ARM64)
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
jobs:
  native-and-arm64:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld binutils python3 gcc
      - name: Generate independent wavetable data
        run: python3 scripts/generate_tables.py
      - name: Run desktop ABI and audio tests
        run: python3 tests/test_plugin.py
      - name: Test on-device graphics contract
        run: node tests/test_canvas.cjs
      - name: Cross-compile and assemble Schwung archive
        run: bash scripts/build.sh
      - name: Verify package and binary
        run: python3 tests/check_package.py
      - name: Confirm exact .tar.gz payload before upload
        shell: bash
        run: |
          test -f dist/sprig-wt-module.tar.gz
          file dist/sprig-wt-module.tar.gz
          tar -tzf dist/sprig-wt-module.tar.gz
          test "$(find dist -maxdepth 1 -name '*.tar.gz' -type f | wc -l)" -eq 1
          echo "Artifact payload: dist/sprig-wt-module.tar.gz"
          echo "GitHub Actions downloads are ZIP-wrapped by GitHub. Extract the ZIP once to get the .tar.gz."
      - uses: actions/upload-artifact@v4
        with:
          name: sprig-wt-targz-download
          path: dist/sprig-wt-module.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
