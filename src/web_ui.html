<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprig WT</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#1b2030;--edge:#353d51;--text:#edf1fa;--dim:#9da9bc;--teal:#72e5cc;--gold:#facb7b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif;padding:14px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:5px 0 14px}header h1{font-size:19px;margin:0;letter-spacing:.07em}
header small{font-size:11px;color:var(--dim)}.status{font-size:11px;color:var(--teal)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
section{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:14px;min-width:0}
h2{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;margin:0 0 13px}
.field{display:block;margin:12px 0}.field span{display:flex;align-items:center;justify-content:space-between;gap:10px}
label{font-size:12px;color:var(--text)}output{font-variant-numeric:tabular-nums;color:var(--teal);font-size:12px}
input[type=range]{display:block;width:100%;margin:9px 0 0;accent-color:var(--teal);cursor:pointer}
select{width:100%;border:1px solid var(--edge);background:var(--bg);color:var(--text);padding:8px;border-radius:6px;margin-top:8px}
canvas{width:100%;height:93px;border:1px solid var(--edge);border-radius:8px;background:#101820}
footer{color:var(--dim);font-size:11px;padding-top:13px;line-height:1.5}
</style></head><body>
<header><div><h1>SPRIG WT <small>0.2 / Move</small></h1><small>Two oscillators · scanning wavetable · analog color</small></div><span class="status" id="status">CONNECTING</span></header>
<main>
<section><h2>01 / Wavetable</h2><canvas id="scope" width="440" height="100" aria-label="Synthesis waveform preview"></canvas><div id="osc"></div></section>
<section><h2>02 / Filter &amp; Color</h2><div id="tone"></div></section>
<section><h2>03 / Motion</h2><div id="motion"></div></section>
<section><h2>04 / Amplitude</h2><div id="amp"></div></section>
</main>
<footer>Independent synth for Schwung. This is a control preview, not a live audio oscilloscope. The Move's native pages remain accessible.</footer>
<script src="/static/schwung-remote-api.js"></script>
<script>
'use strict';
const groups={
 osc:[['wavetable','Wavetable',0,51,1],['position','WT Position',0,100,1],['shape','Shape',0,100,1],['osc2_level','Osc 2 Mix',0,100,1],['detune','Osc 2 Detune',0,100,1]],
 tone:[['cutoff','Cutoff',0,100,1],['resonance','Resonance',0,100,1],['drive','Drive',0,100,1],['filter_env_amt','Filter EG Amount',0,100,1],['filter_env_attack','Filter EG Attack',0,2000,1],['filter_env_decay','Filter EG Decay',0,2000,1],['level','Output',0,100,1]],
 motion:[['lfo_rate','Motion Rate',0,100,1],['lfo_depth','Motion Depth',0,100,1],['lfo_filter','Motion Filter',0,100,1]],
 amp:[['attack','Attack',0,2000,1],['decay','Decay',0,2000,1],['sustain','Sustain',0,100,1],['release','Release',0,2000,1]]
};
const waveNames=['Sine','Saw','Square','Triangle'];const bankNames=['Legacy','Expanded'];const fields={};
const api=window.schwungRemote;const prefix=(api&&api.component)||'synth';
function setParam(key,value){if(api && typeof api.setParam==='function')api.setParam(prefix+':'+key,String(value))}
function control(key,name,min,max,step){
 const root=document.createElement('div');root.className='field';
 const label=document.createElement('label');label.textContent=name;
 const val=document.createElement('output');val.textContent='…';
 const line=document.createElement('span');line.append(label,val);root.append(line);
 const input=(key==='wave'||key==='wt_bank')?document.createElement('select'):document.createElement('input');
 if(key==='wave'||key==='wt_bank')(key==='wave'?waveNames:bankNames).forEach((w,i)=>{const opt=document.createElement('option');opt.value=String(i);opt.textContent=w;input.append(opt)});
 else{input.type='range';input.min=min;input.max=max;input.step=step;}
 input.setAttribute('aria-label',name);
 const change=()=>{val.textContent=key==='wave'?waveNames[+input.value]:key==='wt_bank'?bankNames[+input.value]:input.value;setParam(key,input.value);if(['wavetable','position','shape'].includes(key))drawWave()};
 input.addEventListener('input',change);input.addEventListener('change',change);
 root.append(input);fields[key]={input,val};return root;
}
Object.keys(groups).forEach(group=>{const parent=document.getElementById(group);groups[group].forEach(p=>parent.append(control(...p)))});
function update(key,v){const f=fields[key];if(!f)return;const n=Number(v);if(!Number.isFinite(n))return;f.input.value=String(n);f.val.textContent=key==='wave'?waveNames[n]||String(n):key==='wt_bank'?bankNames[n]||String(n):String(n);if(['wave','position','wt_bank','wt_table','spectral_shape'].includes(key))drawWave()}
function drawWave(){
 const canvas=document.getElementById('scope'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
 ctx.clearRect(0,0,w,h);ctx.strokeStyle='#2b3844';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
 const selected=Number(fields.wavetable.input.value)||0,wave=Math.min(3,selected),pos=(Number(fields.position.input.value)||0)/100,shape=(Number(fields.shape.input.value)||50)/100;
 ctx.strokeStyle='#72e5cc';ctx.lineWidth=2;ctx.beginPath();
 for(let x=0;x<w;x++){let p=x/w*2*Math.PI;let y=wave===0?Math.sin(p):wave===1?2*x/w-1:wave===2?(x/w<.5?1:-1):1-4*Math.abs(x/w-.5);
 y=(1-.20*pos)*y+.20*pos*Math.sin(3*p);if(selected>=4)y=Math.sin(p*(1+selected%12))*.5+Math.sin(p)*.35;y*=.7+.6*shape;
 const py=h/2-y*h*.38;if(x===0)ctx.moveTo(x,py);else ctx.lineTo(x,py)}
 ctx.stroke();
}
update('wavetable',1);update('position',50);update('shape',50);drawWave();
if(api&&typeof api.onParamChange==='function'){
 api.onParamChange(values=>{for(const [key,v] of Object.entries(values||{})){const base=key.startsWith(prefix+':')?key.slice(prefix.length+1):key;if(fields[base])update(base,v)}document.getElementById('status').textContent='CONNECTED'});
}else document.getElementById('status').textContent='OFFLINE PREVIEW';
</script></body></html>
